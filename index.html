<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Keuangan Bulanan</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
    }

    .item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      padding: 8px;
    }

    .income {
      color: green;
    }

    .expense {
      color: red;
    }

    .summary {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>💰 Keuangan Bulanan</h2>

    <input type="date" id="date">
    <input type="text" id="desc" placeholder="Deskripsi">
    <input type="number" id="amount" placeholder="Jumlah (Rp)">

    <select id="type">
      <option value="income">Pemasukan</option>
      <option value="expense">Pengeluaran</option>
    </select>

    <button onclick="addData()">Tambah</button>

    <hr>

    <label>Filter Bulan:</label>
    <input type="month" id="filterMonth" onchange="render()">

    <div id="list"></div>

    <div class="summary">
      Pemasukan: Rp <span id="income">0</span><br>
      Pengeluaran: Rp <span id="expense">0</span><br>
      Saldo: Rp <span id="balance">0</span>
    </div>
  </div>

  <script>
    let data = JSON.parse(localStorage.getItem("keuangan")) || [];

    function save() {
      localStorage.setItem("keuangan", JSON.stringify(data));
    }

    function addData() {
      const date = document.getElementById("date").value;
      const desc = document.getElementById("desc").value;
      const amount = parseInt(document.getElementById("amount").value);
      const type = document.getElementById("type").value;

      if (!date || !desc || !amount) {
        alert("Lengkapi data!");
        return;
      }

      data.push({ date, desc, amount, type });
      save();
      render();

      document.getElementById("date").value = "";
      document.getElementById("desc").value = "";
      document.getElementById("amount").value = "";
    }

    function render() {
      const list = document.getElementById("list");
      const filter = document.getElementById("filterMonth").value;

      list.innerHTML = "";

      let income = 0;
      let expense = 0;

      data.forEach(item => {
        if (filter && !item.date.startsWith(filter)) return;

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
        <span>${item.date} - ${item.desc}</span>
        <span class="${item.type}">
          ${item.type === "income" ? "+" : "-"} Rp ${item.amount}
        </span>
      `;

        list.appendChild(div);

        if (item.type === "income") income += item.amount;
        else expense += item.amount;
      });

      document.getElementById("income").innerText = income;
      document.getElementById("expense").innerText = expense;
      document.getElementById("balance").innerText = income - expense;
    }

    render();
  </script>
</body>
</html>
